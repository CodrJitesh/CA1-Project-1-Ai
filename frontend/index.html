<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Budget Assistant</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --ink: #e7e9ee; --dim: #9aa3b2; --accent: #6ea8fe; --good: #58c98a;
    --bad: #f2777a; --user: #24303f; --trace: #14171d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .lane { font-size: 12px; color: var(--dim); }
  header .lane b { color: var(--accent); }
  .wrap { display: grid; grid-template-columns: 1fr 340px; gap: 0;
    height: calc(100vh - 51px); }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; height: auto; } }

  .chat { display: flex; flex-direction: column; min-height: 0; }
  .log { flex: 1; overflow-y: auto; padding: 20px; display: flex;
    flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.agent { align-self: flex-start; background: var(--panel2);
    border: 1px solid var(--line); }
  .msg.sys { align-self: center; color: var(--dim); font-size: 12px;
    background: none; }
  .trace-toggle { align-self: flex-start; margin: -4px 0 2px; font-size: 12px;
    color: var(--accent); cursor: pointer; user-select: none; background: none;
    border: none; padding: 0; }
  .trace { align-self: flex-start; max-width: 88%; background: var(--trace);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--dim); overflow-x: auto; }
  .trace .step { color: var(--ink); }
  .trace .act { color: var(--accent); }
  .trace .obs { color: var(--good); }
  .trace .mem { color: #d7a45f; }

  form { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); }
  input[type=text] { flex: 1; background: var(--panel2); border: 1px solid var(--line);
    color: var(--ink); border-radius: 9px; padding: 10px 12px; font-size: 14px; }
  button.send { background: var(--accent); color: #08111f; border: none;
    border-radius: 9px; padding: 0 16px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }

  aside { border-left: 1px solid var(--line); background: var(--panel);
    padding: 16px; overflow-y: auto; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--dim); margin: 18px 0 8px; }
  aside h2:first-child { margin-top: 0; }
  .stat { display: flex; justify-content: space-between; padding: 4px 0;
    border-bottom: 1px dashed var(--line); }
  .stat .v { font-variant-numeric: tabular-nums; }
  .stat .v.good { color: var(--good); } .stat .v.bad { color: var(--bad); }
  .cats { margin-top: 6px; }
  .cats .row { display: flex; justify-content: space-between; font-size: 13px;
    color: var(--dim); padding: 2px 0; }
  .scn { width: 100%; text-align: left; background: var(--panel2);
    border: 1px solid var(--line); color: var(--ink); border-radius: 9px;
    padding: 9px 11px; margin-bottom: 8px; cursor: pointer; }
  .scn:hover { border-color: var(--accent); }
  .scn .t { font-weight: 600; font-size: 13px; }
  .scn .b { font-size: 12px; color: var(--dim); margin-top: 3px; }
  .rowbtns { display: flex; gap: 8px; margin-top: 6px; }
  .rowbtns button { flex: 1; background: var(--panel2); border: 1px solid var(--line);
    color: var(--dim); border-radius: 8px; padding: 7px; cursor: pointer; font-size: 12px; }
  .rowbtns button:hover { color: var(--ink); border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Personal Budget Assistant</h1>
  <span class="lane">lane: <b id="lane">…</b> · an agent (tools + plan-act loop + memory), not a chatbot</span>
</header>

<div class="wrap">
  <div class="chat">
    <div class="log" id="log"></div>
    <form id="form">
      <input type="text" id="input" autocomplete="off"
        placeholder="e.g. 'spent 250 on lunch'  or  'can I afford a 2000 trip?'">
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </div>

  <aside>
    <h2>Memory (this session)</h2>
    <div class="stat"><span>Monthly budget</span><span class="v" id="s-budget">—</span></div>
    <div class="stat"><span>Total spent</span><span class="v" id="s-spent">0</span></div>
    <div class="stat"><span>Balance left</span><span class="v" id="s-balance">—</span></div>
    <div class="stat"><span>Expenses logged</span><span class="v" id="s-n">0</span></div>
    <div class="stat"><span>Turns remembered</span><span class="v" id="s-turns">0</span></div>
    <div class="cats" id="cats"></div>

    <h2>Seed a demo conversation</h2>
    <div id="scenarios"></div>

    <h2>Session</h2>
    <div class="rowbtns">
      <button id="reset">Reset conversation</button>
    </div>
  </aside>
</div>

<script>
const $ = s => document.querySelector(s);
const log = $('#log');

function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function fmt(n){ return n == null ? '—' : Number(n).toLocaleString(); }

function addMsg(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function renderTrace(trace){
  if(!trace || !trace.length) return;
  const btn = document.createElement('button');
  btn.className = 'trace-toggle';
  btn.textContent = '▸ trace (' + trace.length + ' steps)';
  const pre = document.createElement('div');
  pre.className = 'trace';
  pre.style.display = 'none';
  pre.innerHTML = trace.map(e => {
    if(e.action === 'memory')
      return `<div><span class="step">[${e.step}]</span> <span class="mem">MEMORY</span> ${esc(e.observation)}</div>`;
    if(e.action === 'final')
      return `<div><span class="step">[${e.step}]</span> ANSWER ${esc(e.thought||'')}</div>`;
    return `<div><span class="step">[${e.step}]</span> THINK ${esc(e.thought||'')}\n`
      + `      <span class="act">ACT</span> ${esc(e.action)}(${esc(JSON.stringify(e.action_input))})\n`
      + `      <span class="obs">OBS</span> ${esc(JSON.stringify(e.observation))}</div>`;
  }).join('');
  btn.onclick = () => {
    const open = pre.style.display === 'none';
    pre.style.display = open ? 'block' : 'none';
    btn.textContent = (open ? '▾' : '▸') + ' trace (' + trace.length + ' steps)';
  };
  log.appendChild(btn);
  log.appendChild(pre);
  log.scrollTop = log.scrollHeight;
}

function renderState(st){
  $('#lane').textContent = st.mode;
  $('#s-budget').textContent = fmt(st.budget);
  $('#s-spent').textContent = fmt(st.total_spent);
  const bal = $('#s-balance');
  bal.textContent = fmt(st.balance);
  bal.className = 'v ' + (st.balance == null ? '' : st.balance < 0 ? 'bad' : 'good');
  $('#s-n').textContent = st.n_expenses;
  $('#s-turns').textContent = st.n_turns;
  const cats = $('#cats');
  cats.innerHTML = Object.entries(st.by_category || {})
    .map(([k,v]) => `<div class="row"><span>${esc(k)}</span><span>${fmt(v)}</span></div>`).join('');
}

async function api(path, body){
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {});
  return r.json();
}

$('#form').onsubmit = async e => {
  e.preventDefault();
  const inp = $('#input');
  const text = inp.value.trim();
  if(!text) return;
  inp.value = '';
  $('#send').disabled = true;
  addMsg('user', text);
  const res = await api('/api/chat', {message: text});
  if(res.error){ addMsg('sys', 'error: ' + res.error); }
  else { addMsg('agent', res.answer); renderTrace(res.trace); renderState(res.state); }
  $('#send').disabled = false;
  inp.focus();
};

$('#reset').onclick = async () => {
  const res = await api('/api/reset', {});
  log.innerHTML = '';
  addMsg('sys', 'conversation reset — memory cleared');
  renderState(res.state);
};

async function loadScenarios(){
  const {scenarios} = await api('/api/scenarios');
  $('#scenarios').innerHTML = '';
  scenarios.forEach(s => {
    const b = document.createElement('button');
    b.className = 'scn';
    b.innerHTML = `<div class="t">${esc(s.title)}</div><div class="b">${esc(s.blurb)}</div>`;
    b.onclick = async () => {
      $('#send').disabled = true;
      log.innerHTML = '';
      addMsg('sys', 'seeded: ' + s.title);
      const res = await api('/api/seed', {key: s.key});
      if(res.error){ addMsg('sys', 'error: ' + res.error); }
      else {
        res.conversation.forEach(m => {
          addMsg(m.role, m.content);
          if(m.role === 'agent') renderTrace(m.trace);
        });
        renderState(res.state);
      }
      $('#send').disabled = false;
    };
    $('#scenarios').appendChild(b);
  });
}

(async () => {
  renderState(await api('/api/state'));
  await loadScenarios();
  addMsg('sys', 'Type a message, or click a seed conversation on the right.');
})();
</script>
</body>
</html>
